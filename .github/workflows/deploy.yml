name: Deploy to VPS

# PRD-01 (production readiness 2026-11-12): production is deployed only from `main`, only after the
# CI quality gate passed for that commit, and the database is dumped before migrations run.
# Rollback: docs/guidelines/deployment-and-rollback.md.
on:
  workflow_run:
    workflows: ["CI & Security Quality Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

# The manual-run gate below reads CI runs through the API.
permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-24.04
    environment: production
    # A CI run that passed for a push to main, or a manual run started from main (which must then
    # find a successful CI push run for the same commit; see "Verify CI passed for this commit").
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      # Production readiness 2026-11-13: a manual run deploys main's HEAD, so it must prove that the
      # CI quality gate passed for exactly that commit (push to main); otherwise nothing is deployed.
      - name: Verify CI passed for this commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${DEPLOY_SHA}&branch=main&event=push&status=success" --jq '.total_count')
          echo "Successful CI push runs on main for ${DEPLOY_SHA}: ${passed}"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "Error: no successful CI run for ${DEPLOY_SHA} on main; refusing to deploy an unverified commit."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build
        env:
          VITE_APP_NAME: "Foresight Radar"

      - name: Package build artifacts
        run: |
          test -d public/build
          tar -czf build.tar.gz -C public build
          ls -lh build.tar.gz

      - name: Validate deployment secrets
        run: |
          echo "Validating required deployment secrets configuration:"
          echo " - VPS_HOST: ${{ secrets.VPS_HOST != '' && 'OK' || 'MISSING' }}"
          echo " - VPS_USERNAME: ${{ secrets.VPS_USERNAME != '' && 'OK' || 'MISSING' }}"
          echo " - VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH != '' && 'OK' || 'MISSING' }}"
          echo " - VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY != '' && 'OK' || 'EMPTY' }}"
          echo " - VPS_PASSWORD: ${{ secrets.VPS_PASSWORD != '' && 'OK' || 'EMPTY' }}"

          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "Error: VPS_HOST secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_USERNAME }}" ]; then
            echo "Error: VPS_USERNAME secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_PROJECT_PATH }}" ]; then
            echo "Error: VPS_PROJECT_PATH secret is not configured."
            exit 1
          fi
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ] && [ -z "${{ secrets.VPS_PASSWORD }}" ]; then
            echo "Error: Neither VPS_SSH_KEY nor VPS_PASSWORD is set. Please add one to Repository Secrets."
            exit 1
          fi

      - name: Upload build archive to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "build.tar.gz"
          target: "${{ secrets.VPS_PROJECT_PATH }}"

      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_DIR="${{ secrets.VPS_PROJECT_PATH }}"
            TARGET_BRANCH="main"
            DEPLOY_SHA="${{ env.DEPLOY_SHA }}"
            BACKUP_DIR="$HOME/foresight-backups"

            if [ -z "$TARGET_DIR" ]; then
              echo "Error: VPS_PROJECT_PATH secret is not set."
              exit 1
            fi

            echo "=========================================================="
            echo "Starting deployment to $TARGET_DIR on branch $TARGET_BRANCH"
            echo "=========================================================="

            cd "$TARGET_DIR"
            PREVIOUS_SHA="$(git rev-parse --short HEAD)"

            # 1. Update git repository
            echo "[1/5] Fetching and pulling latest changes from git..."
            git fetch origin
            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            if [ "$CURRENT_BRANCH" != "$TARGET_BRANCH" ]; then
              git checkout "$TARGET_BRANCH"
            fi
            # Move main to exactly the commit CI tested (fails instead of merging if history diverged).
            git merge --ff-only "$DEPLOY_SHA"
            echo "Deploying $(git rev-parse --short HEAD); previous release: $(git rev-parse --short HEAD@{1})"

            # 1b. Ensure SSL certificate paths exist so Nginx can start cleanly
            echo "[1b/5] Preparing SSL challenge and certificate paths..."
            mkdir -p docker/certbot/conf/live/foresight-radar.id docker/certbot/www
            if [ ! -f "docker/certbot/conf/live/foresight-radar.id/fullchain.pem" ]; then
              echo "Generating temporary self-signed certificate to allow initial Nginx boot..."
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 -keyout "docker/certbot/conf/live/foresight-radar.id/privkey.pem" -out "docker/certbot/conf/live/foresight-radar.id/fullchain.pem" -subj "/CN=localhost"
            fi

            # 1c. Recreate Docker containers if compose config changed
            echo "[1c/5] Recreating Docker containers if compose config changed..."
            docker compose up -d --remove-orphans

            # 2. Extract frontend build artifacts
            if [ -f "build.tar.gz" ]; then
              echo "[2/5] Extracting frontend build artifacts..."
              tar -xzf build.tar.gz -C public/
              rm -f build.tar.gz
              chmod -R 755 public/build
            fi

            # 3. Backend dependencies & database migrations
            echo "[3/5] Running composer and database migrations inside Docker..."
            docker exec -u 0 -e COMPOSER_ALLOW_SUPERUSER=1 laravel_app composer install --no-dev --optimize-autoloader --no-interaction
            # PRD-01 / OPS-02..05: dump the database before migrating with the same script the daily
            # cron job uses (scripts/ops/backup-database.sh): app credentials from .env, owner-only
            # files, .partial until "Dump completed", optional verified off-server copy, retention.
            # A failed dump stops the deploy here, before any migration.
            BACKUP_DIR="$BACKUP_DIR" bash scripts/ops/backup-database.sh "$(git rev-parse --short HEAD@{1})"
            docker exec laravel_app php artisan migrate --force

            # 4. Cache & framework optimization
            echo "[4/5] Optimizing Laravel configuration, routes, and views..."
            docker exec laravel_app php artisan optimize:clear
            docker exec laravel_app php artisan optimize
            docker exec laravel_app php artisan view:cache
            docker exec -u 0 laravel_app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            # 4b/4c. PHP-FPM reload or recreate, nginx test and reload or recreate, then a hash check that
            # the containers see the repository's config (OPS-01). Kept in a script and called in ONE
            # line: `script_stop` checks the exit status after every line of this block, and Deploy #55
            # stopped on the `else` of a multi-line `if` (entered with $? = 1). Avoid multi-line
            # if/else and backslash continuations in this script block.
            bash scripts/ops/apply-runtime-config.sh

            # 5. Restart background queue worker
            echo "[5/5] Restarting Laravel queue worker..."
            docker restart laravel_queue || docker compose restart queue

            # 6. Post-deploy health: release sha, containers, no pending migration, /up through nginx,
            # and a line in ~/foresight-releases.log (previous release, for rollback). Fails the deploy.
            bash scripts/ops/post-deploy-check.sh "$DEPLOY_SHA" "$PREVIOUS_SHA"

            echo "=========================================================="
            echo "Deployment completed successfully."
            echo "=========================================================="

