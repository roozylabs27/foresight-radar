name: CI & Security Quality Gate

on:
  push:
    branches: [main, master, dev, develop, development, 'feat/**']
  pull_request:
    branches: [main, master, dev, develop, development, 'feat/**']

jobs:
  backend:
    name: Backend Tests & Security Audit
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, mbstring, bcmath, gd, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Security Policy (production readiness 2026-11-13): blocks on any advisory that is not listed with
      # a reason under config.audit.ignore in composer.json (the Laravel 11 advisories with no 11.x fix,
      # docs/production-readiness/known-risks.md R-08). A new advisory fails CI.
      - name: Composer Security Audit (Block on unlisted advisories)
        run: composer audit

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Code style check (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G

      - name: Ensure fallback Vite manifest exists
        run: |
          mkdir -p public/build
          echo '{}' > public/build/manifest.json

      - name: Run test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  frontend:
    name: Frontend Build & Security Audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Security Policy: Blocks CI if any CRITICAL severity vulnerability is detected.
      # Known SheetJS/esbuild high/moderate advisories remain tracked until replacement packages are adopted.
      - name: NPM Security Audit (Block on Critical)
        run: npm audit --audit-level=critical

      # The frontend is JavaScript/JSX; ESLint replaces the old tsc step, which checked no source file.
      # `npm run lint` uses --max-warnings=0 (since 2026-11-13): errors (undefined names, rules of hooks,
      # broken JSX) and any new warning (hook dependencies, accessibility) fail CI.
      - name: ESLint (resources/js)
        run: npm run lint

      - name: Build production assets
        run: npm run build
        env:
          VITE_APP_NAME: "Foresight Radar"

  e2e:
    name: Headless E2E Smoke & Critical Journeys
    needs: [backend, frontend]
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, redis
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM dependencies
        run: npm ci

      - name: Build assets
        run: npm run build
        env:
          VITE_APP_NAME: "Foresight Radar"

      - name: Prepare Laravel application
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed
          php artisan serve --port=8080 &

      - name: Run E2E Smoke Test
        run: npx e2e run tests/e2e/smoke.e2e.ts
