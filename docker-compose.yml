services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    networks:
      - laravel

  # Runs queued LLM jobs (signal extraction, scenario narratives) outside the
  # web request. Restarts hourly, and after `docker restart laravel_queue`, to
  # load changed PHP code.
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: foresight-radar-app
    container_name: laravel_queue
    command: php artisan queue:work --tries=1 --timeout=310 --sleep=3 --max-time=3600
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mysql
    networks:
      - laravel

  # Runs the Laravel scheduler (routes/console.php), e.g. the daily fetch of
  # external early warning indicators. Jobs it queues go to the queue service.
  scheduler:
    image: foresight-radar-app
    container_name: laravel_scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    depends_on:
      - mysql
      - queue
    networks:
      - laravel

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "443:443"
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    depends_on:
      - app
    networks:
      - laravel

  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foresight_radar
      MYSQL_USER: foresight-radar
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - laravel

networks:
  laravel:

volumes:
  mysql_data:
